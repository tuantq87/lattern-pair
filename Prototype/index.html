const CAT_SEEDS = [4127, 7310, 2589, 9043, 1776, 6652, 3318, 8401, 5260];

// palette for a planet at an ecological tier (each 150 m layer shifts hue / light)

// ============================================================ assets

  'spike', 'root', 'crawler0', 'crawler1', 'door_shut', 'door_open', 'mush', 'mush_sq', 'bridge', 'flower_bud', 'flower_open',

NAMES.forEach(n => { const i = new Image(); i.onload = i.onerror = () => loaded++; i.src = 'assets/' + n + '.webp'; IMG[n] = i; });

} catch (e) { fontReady = true; }
setTimeout(() => { fontReady = true; }, 2500);
const F = (s, w = 600) => w + ' ' + s + 'px QS, "Trebuchet MS", system-ui, sans-serif';
const ok = i => i && i.complete && i.naturalWidth > 0;
const TINT = new Map();
function tint(name, col) {   // multiply-tint a grey asset, keep its alpha; cached per colour
  const k = name + col; let c = TINT.get(k); if (c) return c; const im = IMG[name]; if (!ok(im)) return null;

}

// ============================================================ audio — all synthesised (lo-fi 85 BPM BGM + SFX)
let AC = null, MG = null, MUS = null, SFXG = null, NB = null, RAIN = null, DBASS = null, DLFO = null, music = { on: false, next: 0, step: 0 };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function ainit() {

const quiet = () => !AC || G.silent;
function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }

}

  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NB; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(fc, t);

// instruments
function pluck(f, t, v, dest, dur = 0.5) {   // soft filtered pluck
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 2; lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 6, t); lp.frequency.exponentialRampToValueAtTime(f * 1.2, t + dur);

const INST = { rhodes, pluck, bell, kalimba };
// BGM scheduler: 85 BPM, 8th-note steps, I–vi–IV–V(sus) in the planet tonic, pentatonic lead, warm pad, soft kick, brush hats, rain
const BPM = 85, STEP = 60 / BPM / 2, PROG = [[0, 4, 7, 11], [9, 12, 16, 19], [5, 9, 12, 16], [7, 12, 14, 17]];
let leadR = mulberry32(7), leadDeg = 5;
function musicTick() {

  const tonic = (G.planet || CAT[G.sel] || CAT[0]).tonic, lead = (G.planet || CAT[G.sel] || CAT[0]).lead;
  while (music.next < AC.currentTime + 0.25) {

    if (st === 0) {   // pad + rhodes chord

        o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = f; o2.frequency.value = f * 1.006; lp.type = 'lowpass'; lp.frequency.value = 650;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.018, t + 0.6); g.gain.linearRampToValueAtTime(0.0001, t + STEP * 8 + 0.3);

// original 4–6 note "nocturne" piano motifs for each 150 m milestone (semitones from tonic, durations in s) — composed for this game
const MOTIFS = [
  { n: [7, 12, 11, 7, 9, 4], d: [0.42, 0.3, 0.3, 0.46, 0.4, 1.2] },
  { n: [4, 7, 14, 12, 11, 12], d: [0.3, 0.3, 0.5, 0.26, 0.26, 1.3] },
  { n: [12, 9, 7, 5, 4], d: [0.5, 0.32, 0.32, 0.4, 1.4] },

  rumble: () => { if (quiet()) return; const t = AC.currentTime; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.connect(SFXG); osc(68, t, 0.7, 'sawtooth', 0.08, lp, 0.08, 46); nz(t, 0.6, 0.05, 180, 'lowpass', SFXG); },
  poof: () => { if (quiet()) return; const t = AC.currentTime; nz(t, 0.35, 0.08, 1200, 'bandpass', SFXG, 300); bell(mtof(84), t, 0.04, SFXG, 0.6); },
  hit: () => { if (quiet()) return; const t = AC.currentTime; nz(t, 0.25, 0.3, 380, 'lowpass', SFXG, 120); osc(95, t, 0.25, 'sine', 0.25, SFXG, 0.003, 38); },

    const m = MOTIFS[(tier - 1 + MOTIFS.length) % MOTIFS.length]; let tt = t + 0.55;
